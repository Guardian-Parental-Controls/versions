name: Publish release feed

on:
  repository_dispatch:
    types: [component-release]
  push:
    branches: [main]
    paths:
      - "components/**"
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - "schema/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Create automation token
        if: github.event_name == 'repository_dispatch'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GUARDIAN_VERSIONS_APP_ID }}
          private-key: ${{ secrets.GUARDIAN_VERSIONS_PRIVATE_KEY }}
          owner: Guardian-Parental-Controls
          repositories: versions

      - name: Check out versions
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Store dispatched component
        if: github.event_name == 'repository_dispatch'
        env:
          COMPONENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$COMPONENT_PAYLOAD" > /tmp/component.json
          python scripts/update_component.py --payload /tmp/component.json

      - name: Compile feed
        run: python scripts/compile_feed.py

      - name: Validate feed
        run: |
          python -m jsonschema \
            --instance feed.json \
            schema/feed.schema.json
          python -m pytest -q

      - name: Commit compiled feed
        if: github.event_name == 'repository_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: publish ${{ github.event.client_payload.component }} v${{ github.event.client_payload.version }}"
          file_pattern: "components/*.json feed.json"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: compile
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy feed
        id: deployment
        uses: actions/deploy-pages@v4
